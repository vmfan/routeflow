name: C++ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3-dev libboost-all-dev
        python -m pip install --upgrade pip
        python -m pip install pybind11

    - name: Configure CMake
      run: |
        cmake -S cpp-engine -B cpp-engine/build \
          -DCMAKE_BUILD_TYPE=Release \
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

    - name: Build Engine
      run: cmake --build cpp-engine/build --config Release

    - name: Run Unit Tests
      working-directory: cpp-engine/build
      run: ctest --output-on-failure

    - name: Install GTest
      run: sudo apt-get update && sudo apt-get install -y libgtest-dev