name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3-dev libboost-all-dev

    - name: Install Python Dependencies
      run: |
        cd api
        python -m pip install --upgrade pip pybind11
        pip install -r requirements.txt
        pip install pytest pytest-mock

    - name: Build routeflowengine
      run: |
        cmake -S cpp-engine -B cpp-engine/build \
          -DCMAKE_BUILD_TYPE=Release \
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
        cmake --build cpp-engine/build --config Release

    - name: Run Pytest
      working-directory: api
      env:
        PYTHONPATH: ${{ github.workspace }}/cpp-engine/build:${{ github.workspace }}
      run: pytest -v